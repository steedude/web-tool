shellEmulator: true

trustPolicy: no-downgrade

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  unrs-resolver: true
trustPolicyExclude:
  - nanoid@3.3.14
  - semver@6.3.1
packages:
  - services/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - esbuild
  - unrs-resolver
